name: Refresh NBA EDGE picks
on:
  workflow_dispatch:
    inputs:
      refresh_odds:
        description: 'Use the one allowed second paid refresh today (if eligible)'
        type: boolean
        default: false
  schedule:
    # Hourly free NBA scoreboard checks; early games trigger the first paid
    # fetch up to 2 hours before tipoff. 5:13 PM CT remains the late fallback.
    - cron: '13 9-17 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check schedule using free ESPN NBA scoreboard
        id: gate
        env:
          MANUAL_ODDS_REFRESH: ${{ inputs.refresh_odds || 'false' }}
        run: python scripts/adaptive_schedule.py
      - name: Verify Python syntax and run offline tests
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -v
      - name: Refresh historical logs and sportsbook props
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_EDGE_ODDS_REFRESH: ${{ steps.gate.outputs.refresh_odds }}
        run: python scripts/update.py
      - name: Free ESPN injury flags (best effort, shadow only)
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/injury_review.py
      - name: Export daily analysis and historical calibration diagnostics
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/analysis_export.py
      - name: Commit only public snapshots
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/game_logs.json docs/tracker.json docs/daily_analysis.json docs/injury_review.json docs/ranking_experiment.json docs/projection_shadow.json docs/gap_threshold_experiment.json
          if [ -f docs/odds_cache.json ]; then git add docs/odds_cache.json; fi
          git diff --cached --quiet || (git commit -m 'Refresh NBA EDGE data' && git push)
      - name: Notify ntfy about workflow outcome
        if: always() && steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify.py
