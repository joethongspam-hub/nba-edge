name: Refresh NBA EDGE picks
on:
  workflow_dispatch:
  schedule:
    - cron: '13 17 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: |
          python -m py_compile scripts/update.py scripts/analysis_export.py scripts/credit_budget.py scripts/injury_review.py
          python -m unittest discover -s tests -v
      - name: Refresh historical logs and sportsbook props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update.py
      - name: Free ESPN injury flags (best effort, shadow only)
        run: python scripts/injury_review.py
      - name: Export daily analysis and historical calibration diagnostics
        run: python scripts/analysis_export.py
      - name: Commit only public snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/game_logs.json docs/tracker.json docs/daily_analysis.json docs/injury_review.json docs/ranking_experiment.json docs/projection_shadow.json
          if [ -f docs/odds_cache.json ]; then git add docs/odds_cache.json; fi
          git diff --cached --quiet || (git commit -m 'Refresh NBA EDGE data' && git push)
      - name: Notify ntfy about workflow outcome
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify.py
