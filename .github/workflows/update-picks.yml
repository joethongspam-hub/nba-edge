name: Refresh NBA EDGE picks
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14,17,20,23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile scripts/update.py
      - name: Refresh historical logs and sportsbook props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update.py
      - name: Commit only public snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/game_logs.json docs/tracker.json
          git diff --cached --quiet || (git commit -m 'Refresh NBA EDGE data' && git push)
