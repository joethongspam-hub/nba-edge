name: Audit historical NHL goalie sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nhl_historical_goalie_probe.py'
      - '.github/workflows/nhl-historical-goalie-probe.yml'
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nhl_historical_goalie_probe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/nhl_historical_goalie_probe.json
          git diff --cached --quiet || (git commit -m 'Audit historical goalie sources' && git push)
