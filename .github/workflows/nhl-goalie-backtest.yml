name: Historical NHL goalie backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nhl_goalie_backtest.py'
      - '.github/workflows/nhl-goalie-backtest.yml'
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Restore historical research cache
        uses: actions/cache/restore@v4
        with:
          path: .research-cache/nhl-goalies-v1
          key: nhl-goalie-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhl-goalie-history-v1-
      - run: python scripts/nhl_goalie_backtest.py
      - name: Save historical research cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .research-cache/nhl-goalies-v1
          key: nhl-goalie-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/nhl_goalie_backtest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish historical goalie backtest'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
