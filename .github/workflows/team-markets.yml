name: Refresh SPORTS EDGE team markets
on:
  workflow_dispatch:
  schedule:
    # Central time: morning slate, afternoon refresh and evening refresh.
    - cron: '13 9,14,17 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch team markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/team_markets.py
      - name: Generate experimental paper parlay export
        run: python scripts/paper_parlay_analysis.py docs/team_daily_analysis.json docs/paper_parlay_analysis.json
      - name: Archive and settle paper parlays
        run: python scripts/paper_parlay_tracker.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/team_markets.json docs/team_tracker.json docs/team_backtest.json docs/team_daily_analysis.json docs/paper_parlay_analysis.json docs/paper_parlay_tracker.json
          if [ -f docs/nba_efficiency_cache.json ]; then git add docs/nba_efficiency_cache.json; fi
          git diff --cached --quiet || (git commit -m 'Refresh SPORTS EDGE team markets' && git push)
      - name: Notify ntfy about team-market refresh
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEAM_MARKETS_NOTIFY: 'true'
        run: python scripts/notify.py
