name: Probe NHL goalie sources
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-refresh
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe sources
        run: python scripts/espn_goalie_probe.py
      - name: Publish diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/nhl_goalie_probe.json
          git diff --cached --quiet || (git commit -m 'Probe NHL goalie sources' && git push)
