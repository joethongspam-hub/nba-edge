name: Validate NBA EDGE code (no API requests)
on:
  pull_request:
  push:
    branches:
      - feature/performance-audit-diagnostics
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
